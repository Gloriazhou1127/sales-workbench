<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销售日报</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; min-height: 100vh;
  }
  .top-bar {
    background: #fff; border-bottom: 1px solid #e8e8e8;
    padding: 0 24px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .top-bar .logo { font-size: 16px; font-weight: 500; color: #1a1a1a; }
  .top-bar .right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .top-bar .btn-sm {
    font-size: 12px; padding: 4px 14px; border-radius: 6px; border: 1px solid #ddd;
    background: #fff; cursor: pointer; color: #555;
  }
  .top-bar .btn-sm:hover { border-color: #378ADD; color: #378ADD; }

  .main-content { padding: 20px 24px; max-width: 1000px; margin: 0 auto; }

  /* 日期头 */
  .date-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .date-header .today-label { font-size: 20px; font-weight: 600; color: #1a1a1a; }
  .date-header .week-info {
    font-size: 13px; color: #888;
    display: flex; align-items: center; gap: 12px;
  }
  .date-header .deadline-badge {
    font-size: 12px; padding: 3px 12px; border-radius: 12px;
    font-weight: 500;
  }
  .deadline-urgent { background: #FCEBEB; color: #A32D2D; }
  .deadline-normal { background: #FAEEDA; color: #854F0B; }
  .deadline-ok { background: #EAF3DE; color: #3B6D11; }

  /* 汇总卡片 */
  .summary-cards {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 16px;
  }
  .sum-card {
    background: #fff; border-radius: 10px; padding: 16px 20px;
    border: 1px solid #eee;
  }
  .sum-card .card-label { font-size: 12px; color: #999; margin-bottom: 6px; }
  .sum-card .card-value { font-size: 28px; font-weight: 600; color: #1a1a1a; }
  .sum-card .card-sub { font-size: 12px; color: #bbb; margin-top: 2px; }

  /* 面板 */
  .panel-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .panel {
    background: #fff; border-radius: 10px; border: 1px solid #eee;
    padding: 18px 22px;
  }
  .panel-full { grid-column: 1 / -1; }
  .panel .panel-title {
    font-size: 14px; font-weight: 500; color: #1a1a1a;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .panel .panel-title .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }

  /* 进度条 */
  .progress-wrap { margin-bottom: 10px; }
  .progress-header { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 6px; }
  .progress-header strong { color: #1a1a1a; }
  .progress-bar {
    height: 8px; border-radius: 4px; background: #f0f0f0; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 4px; background: #378ADD;
    transition: width 0.4s;
  }
  .progress-stats {
    display: flex; gap: 20px; margin-top: 8px; font-size: 12px; color: #888;
  }
  .progress-stats span { display: flex; align-items: center; gap: 4px; }
  .stat-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

  /* 部门表 */
  .dept-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .dept-table th {
    text-align: left; padding: 8px 10px; font-weight: 500; color: #999;
    border-bottom: 1px solid #f0f0f0; font-size: 11px;
  }
  .dept-table td { padding: 8px 10px; border-bottom: 1px solid #f5f5f5; color: #333; }
  .dept-table tr:last-child td { border-bottom: none; }
  .dept-progress-bar {
    height: 6px; border-radius: 3px; background: #f0f0f0; min-width: 80px;
  }
  .dept-progress-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.3s;
  }
  .dept-progress-fill.low { background: #E24B4A; }
  .dept-progress-fill.mid { background: #E67E22; }
  .dept-progress-fill.high { background: #378ADD; }
  .dept-progress-fill.done { background: #16a34a; }

  /* 活动列表 */
  .activity-list { list-style: none; }
  .activity-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid #f5f5f5;
    font-size: 13px;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-time {
    font-size: 11px; color: #bbb; min-width: 50px; flex-shrink: 0;
  }
  .activity-body { flex: 1; }
  .activity-body .act-customer { font-weight: 500; color: #1a1a1a; }
  .activity-body .act-dept { color: #999; font-size: 12px; margin-left: 6px; }
  .activity-body .act-detail { color: #666; font-size: 12px; margin-top: 2px; }
  .activity-stage {
    font-size: 11px; padding: 1px 8px; border-radius: 8px;
    white-space: nowrap; font-weight: 500; flex-shrink: 0;
  }
  .stage-1 { background: #E6F1FB; color: #185FA5; }
  .stage-2 { background: #EEEDFE; color: #534AB7; }
  .stage-3 { background: #E1F5EE; color: #0F6E56; }
  .stage-4 { background: #FAEEDA; color: #854F0B; }
  .stage-5 { background: #EAF3DE; color: #3B6D11; }
  .stage-6 { background: #FBEAF0; color: #993556; }

  .empty-hint { text-align: center; padding: 30px 0; color: #ccc; font-size: 13px; }
  .loading-hint { text-align: center; padding: 40px 0; color: #999; font-size: 14px; }

  /* 响应式 */
  @media (max-width: 768px) {
    .summary-cards { grid-template-columns: 1fr; }
    .panel-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="top-bar">
  <span class="logo">销售日报</span>
  <div class="right">
    <button class="btn-sm" onclick="location.href='/workbench'">返回工作台</button>
    <button class="btn-sm" onclick="logout()">退出</button>
  </div>
</div>
<div class="main-content">
  <!-- 日期头 -->
  <div class="date-header">
    <div>
      <div class="today-label" id="todayLabel">--</div>
      <div class="week-info" id="weekInfo">--</div>
    </div>
    <div>
      <span class="deadline-badge" id="deadlineBadge">--</span>
    </div>
  </div>

  <!-- 今日汇总卡片 -->
  <div class="summary-cards">
    <div class="sum-card">
      <div class="card-label">今日新增客户</div>
      <div class="card-value" id="cardNewCust">-</div>
      <div class="card-sub">created_date = 今天</div>
    </div>
    <div class="sum-card">
      <div class="card-label">今日新增打点</div>
      <div class="card-value" id="cardNewCheckin">-</div>
      <div class="card-sub">checkin_date = 今天</div>
    </div>
    <div class="sum-card">
      <div class="card-label">今日填报数</div>
      <div class="card-value" id="cardFollowup">-</div>
      <div class="card-sub">今日提交的跟进记录</div>
    </div>
  </div>

  <!-- 本周进度 + 今日填报详情 -->
  <div class="panel-row">
    <div class="panel">
      <div class="panel-title"><span class="dot" style="background:#378ADD"></span>本周填报进度</div>
      <div class="progress-wrap">
        <div class="progress-header">
          <span>已完成 <strong id="wkFilled">-</strong> / <span id="wkTotal">-</span></span>
          <span id="wkRate">-</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="wkProgressBar" style="width:0%"></div>
        </div>
        <div class="progress-stats">
          <span><span class="stat-dot" style="background:#378ADD"></span> 已填 <strong id="wkFilled2">-</strong></span>
          <span><span class="stat-dot" style="background:#f0f0f0"></span> 未填 <strong id="wkUnfilled">-</strong></span>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title"><span class="dot" style="background:#E67E22"></span>今日填报明细</div>
      <div id="todayDetail">
        <div class="empty-hint">今日暂无填报记录</div>
      </div>
    </div>
  </div>

  <!-- 各部门进度 -->
  <div class="panel">
    <div class="panel-title"><span class="dot" style="background:#16a34a"></span>各部门本周填报进度</div>
    <div id="deptProgress">
      <div class="loading-hint">加载中...</div>
    </div>
  </div>

  <!-- 最近活动 -->
  <div class="panel" style="margin-top:14px">
    <div class="panel-title"><span class="dot" style="background:#534AB7"></span>最近活动</div>
    <div id="recentActivity">
      <div class="empty-hint">暂无最近活动</div>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) { window.location.href = '/'; }

const STAGE_NAMES = {
  '1': '零星采购/推进试用', '2': '落地使用&首轮跟进',
  '3': '深度应用&每周运维', '4': '整体复盘&价值量化',
  '5': '政策推送&促成集采', '6': '无采购意向'
};

async function init() {
  try {
    const res = await fetch('/api/daily-report/summary', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) {
      if (res.status === 401) { logout(); return; }
      throw new Error('load failed');
    }
    const data = await res.json();
    render(data);
  } catch (e) {
    console.error(e);
  }
}

function render(data) {
  const di = data.date_info;
  const td = data.today;
  const wk = data.this_week;

  // 日期头
  const today = new Date(di.today);
  const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  document.getElementById('todayLabel').textContent =
    `${di.today} ${weekdays[today.getDay()]}`;
  document.getElementById('weekInfo').textContent =
    `本周：${di.week_start} ~ ${di.week_end} | 截止 ${di.deadline_date}`;

  const badge = document.getElementById('deadlineBadge');
  if (di.days_remaining === 0) {
    badge.textContent = '今天截止';
    badge.className = 'deadline-badge deadline-urgent';
  } else if (di.days_remaining <= 2) {
    badge.textContent = '还剩 ' + di.days_remaining + ' 天';
    badge.className = 'deadline-badge deadline-normal';
  } else {
    badge.textContent = '还剩 ' + di.days_remaining + ' 天';
    badge.className = 'deadline-badge deadline-ok';
  }

  // 今日汇总卡片
  document.getElementById('cardNewCust').textContent = td.new_customers;
  document.getElementById('cardNewCheckin').textContent = td.new_checkins;
  document.getElementById('cardFollowup').textContent = td.followups;

  // 本周进度
  document.getElementById('wkFilled').textContent = wk.filled;
  document.getElementById('wkTotal').textContent = wk.total;
  document.getElementById('wkFilled2').textContent = wk.filled;
  document.getElementById('wkUnfilled').textContent = wk.unfilled;
  document.getElementById('wkRate').textContent = wk.rate + '%';
  document.getElementById('wkProgressBar').style.width = wk.rate + '%';

  // 今日填报明细
  const detailEl = document.getElementById('todayDetail');
  if (td.records && td.records.length > 0) {
    detailEl.innerHTML = '<ul class="activity-list">' +
      td.records.map(r => renderActivityItem(r)).join('') +
      '</ul>';
  } else {
    detailEl.innerHTML = '<div class="empty-hint">今日暂无填报记录</div>';
  }

  // 各部门进度
  renderDeptTable(wk.departments);

  // 最近活动
  const recentEl = document.getElementById('recentActivity');
  if (data.recent && data.recent.length > 0) {
    recentEl.innerHTML = '<ul class="activity-list">' +
      data.recent.map(r => renderActivityItem(r)).join('') +
      '</ul>';
  } else {
    recentEl.innerHTML = '<div class="empty-hint">暂无最近活动</div>';
  }
}

function renderActivityItem(r) {
  const timeStr = r.filled_at ? r.filled_at.replace('T', ' ').substring(0, 16) : '--';
  const stage = r.stage || '';
  const stageClass = stage ? 'stage-' + stage : '';
  const stageName = STAGE_NAMES[stage] || ('阶段 ' + stage);
  return `<li class="activity-item">
    <span class="activity-time">${timeStr}</span>
    <div class="activity-body">
      <span class="act-customer">${escHtml(r.customer_name)}</span>
      <span class="act-dept">${escHtml(r.department || '')}</span>
      <div class="act-detail">${escHtml(r.filled_by)} 填报</div>
    </div>
    ${stage ? '<span class="activity-stage ' + stageClass + '">' + stageName + '</span>' : ''}
  </li>`;
}

function renderDeptTable(departments) {
  const el = document.getElementById('deptProgress');
  if (!departments || departments.length === 0) {
    el.innerHTML = '<div class="empty-hint">暂无部门数据</div>';
    return;
  }

  const rows = departments.map(d => {
    let colorClass = 'done';
    if (d.rate < 50) colorClass = 'low';
    else if (d.rate < 80) colorClass = 'mid';
    else if (d.rate < 100) colorClass = 'high';

    return `<tr>
      <td>${escHtml(d.department)}</td>
      <td>${d.filled} / ${d.total}</td>
      <td>${d.rate}%</td>
      <td>
        <div class="dept-progress-bar">
          <div class="dept-progress-fill ${colorClass}" style="width:${Math.min(d.rate, 100)}%"></div>
        </div>
      </td>
    </tr>`;
  }).join('');

  el.innerHTML = `<table class="dept-table">
    <thead><tr><th>部门</th><th>已完成/总数</th><th>完成率</th><th>进度</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function escHtml(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '/';
}

init();
</script>
</body>
</html>
