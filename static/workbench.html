<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销售工作台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; min-height: 100vh;
  }
  .top-bar {
    background: #fff; border-bottom: 1px solid #e8e8e8;
    padding: 0 28px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .top-bar .logo { font-size: 16px; font-weight: 500; color: #1a1a1a; }
  .top-bar .right { display: flex; align-items: center; gap: 16px; font-size: 13px; }
  .top-bar .user-info { color: #555; }
  .top-bar .role-badge {
    font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 500;
  }
  .role-admin { background: #FBEAF0; color: #993556; }
  .role-user { background: #E6F1FB; color: #185FA5; }
  .top-bar .btn-sm {
    font-size: 12px; padding: 4px 14px; border-radius: 6px; border: 1px solid #ddd;
    background: #fff; cursor: pointer; color: #555; transition: all 0.15s;
  }
  .top-bar .btn-sm:hover { border-color: #378ADD; color: #378ADD; }
  .main-content { padding: 24px 28px; max-width: 1100px; margin: 0 auto; }
  .section-title {
    font-size: 13px; color: #999; margin-bottom: 14px; letter-spacing: 0.5px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .card {
    background: #fff; border-radius: 10px; padding: 20px 22px;
    border: 1px solid #eee; cursor: pointer; transition: all 0.2s;
    position: relative;
  }
  .card:hover { border-color: #d0d0d0; transform: translateY(-1px); }
  .card:active { transform: translateY(0); }
  .card .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card .icon-box {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .tag {
    font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 500;
    white-space: nowrap;
  }
  .tag-online { background: #EAF3DE; color: #3B6D11; }
  .tag-local { background: #FAEEDA; color: #854F0B; }
  .tag-todo { background: #F1EFE8; color: #5F5E5A; }
  .tag-admin { background: #FBEAF0; color: #993556; }
  .card h3 { font-size: 15px; font-weight: 500; color: #1a1a1a; margin-bottom: 4px; }
  .card .desc { font-size: 12px; color: #999; line-height: 1.5; margin-bottom: 18px; }
  .card .card-foot {
    padding-top: 14px; border-top: 1px solid #f0f0f0;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px;
  }
  .card .link-text {
    color: #378ADD; display: flex; align-items: center; gap: 4px;
  }
  .card .link-text svg { flex-shrink: 0; }
  .card.disabled {
    opacity: 0.55; cursor: default;
  }
  .card.disabled:hover { border-color: #eee; transform: none; }
  .card.disabled .link-text { color: #bbb; }

  .loading { text-align: center; padding: 80px 0; color: #999; font-size: 14px; }
  .error { text-align: center; padding: 80px 0; color: #E24B4A; font-size: 14px; }
  .empty-hint {
    text-align: center; padding: 40px 0; color: #bbb; font-size: 13px;
  }

  .reminder-bar {
    display: flex; align-items: center; gap: 16px;
    background: #fff; border-radius: 10px; padding: 16px 22px;
    border: 1px solid #eee; margin-bottom: 18px;
    font-size: 13px; color: #555;
  }
  .reminder-bar .reminder-icon { font-size: 24px; flex-shrink: 0; }
  .reminder-bar .reminder-text { flex: 1; line-height: 1.6; }
  .reminder-bar .reminder-text strong { color: #E24B4A; font-weight: 600; }
  .reminder-bar .reminder-text .deadline { color: #E67E22; font-weight: 500; }
  .reminder-bar .reminder-btn {
    padding: 6px 16px; border-radius: 6px; border: 1px solid #378ADD;
    background: #378ADD; color: #fff; cursor: pointer; font-size: 12px;
    white-space: nowrap; transition: all .15s;
    text-decoration: none;
  }
  .reminder-bar .reminder-btn:hover { background: #2B6FC8; }
  .reminder-bar.done { border-color: #dcfce7; background: #f0fdf4; }
  .reminder-bar.done .reminder-text strong { color: #166534; }
  .reminder-bar.done .reminder-btn { background: #16a34a; border-color: #16a34a; }

  /* Change Password Modal */
  .pwd-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.4); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: all .2s;
  }
  .pwd-modal-overlay.show { opacity: 1; visibility: visible; }
  .pwd-modal {
    background: #fff; border-radius: 14px; padding: 28px 24px;
    width: 380px; max-width: 92vw; box-shadow: 0 12px 40px rgba(0,0,0,.15);
    transform: scale(.95); transition: transform .25s;
  }
  .pwd-modal-overlay.show .pwd-modal { transform: scale(1); }
  .pwd-modal h3 { font-size: 17px; font-weight: 600; color: #1a1a1a; margin-bottom: 20px; }
  .pwd-modal .form-group { margin-bottom: 16px; }
  .pwd-modal .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
  .pwd-modal .form-group input {
    width: 100%; padding: 9px 12px; border: 1px solid #d0d5dd;
    border-radius: 8px; font-size: 14px; transition: border-color .15s;
    box-sizing: border-box;
  }
  .pwd-modal .form-group input:focus { border-color: #378ADD; outline: none; }
  .pwd-modal .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .pwd-modal .btn-row button {
    padding: 8px 20px; border-radius: 8px; border: none; font-size: 13px;
    cursor: pointer; font-weight: 500; transition: all .15s;
  }
  .pwd-modal .btn-cancel { background: #f0f2f5; color: #555; }
  .pwd-modal .btn-cancel:hover { background: #e0e3e8; }
  .pwd-modal .btn-confirm { background: #378ADD; color: #fff; }
  .pwd-modal .btn-confirm:hover { background: #2B6FC8; }
  .pwd-modal .err-msg { color: #E24B4A; font-size: 12px; margin-top: 2px; display: none; }
</style>
</head>
<body>
<div class="top-bar">
  <span class="logo">销售工作台</span>
  <div class="right">
    <span class="user-info" id="userDisplay"></span>
    <span class="role-badge" id="roleBadge"></span>
    <button class="btn-sm" id="adminBtn" style="display:none" onclick="location.href='/admin'">管理后台</button>
    <button class="btn-sm" onclick="showChangePwd()">修改密码</button>
    <button class="btn-sm" onclick="logout()">退出</button>
  </div>
</div>
<div class="main-content">
  <div class="reminder-bar" id="reminderBar" style="display:none">
    <span class="reminder-icon">⏰</span>
    <span class="reminder-text" id="reminderText"></span>
    <a class="reminder-btn" href="/key-account/hardware">去填报</a>
  </div>
  <div class="section-title">功能模块</div>
  <div class="grid" id="moduleGrid">
    <div class="loading">加载中...</div>
  </div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) { window.location.href = '/'; }

let currentUser = null;

async function init() {
  try {
    const userRes = await fetch('/api/user/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!userRes.ok) throw new Error('auth failed');
    currentUser = (await userRes.json());
    document.getElementById('userDisplay').textContent = currentUser.display_name;
    const badge = document.getElementById('roleBadge');
    badge.textContent = currentUser.role === 'admin' ? '管理员' : '普通用户';
    badge.className = 'role-badge ' + (currentUser.role === 'admin' ? 'role-admin' : 'role-user');
    if (currentUser.role === 'admin') {
      document.getElementById('adminBtn').style.display = '';
    }

    const modRes = await fetch('/api/modules', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!modRes.ok) throw new Error('load modules failed');
    const data = await modRes.json();
    renderModules(data.modules);

    // 加载待办提醒
    loadReminder();
  } catch (err) {
    if (err.message === 'auth failed') {
      logout();
    } else {
      document.getElementById('moduleGrid').innerHTML = '<div class="error">加载失败，请刷新重试</div>';
    }
  }
}

function renderModules(modules) {
  const grid = document.getElementById('moduleGrid');
  if (!modules || modules.length === 0) {
    grid.innerHTML = '<div class="empty-hint">暂无可用模块</div>';
    return;
  }
  grid.innerHTML = modules.map(m => {
    const hasLink = m.link_url && m.link_url.trim();
    const isInternal = hasLink && m.link_url.startsWith('/');
    const cls = hasLink ? 'card' : 'card disabled';
    const tagClass = 'tag tag-' + m.link_type;
    const tagText = { online: '线上', local: '本地', todo: '待接入', admin: '管理员' }[m.link_type] || m.link_type;

    const iconHTML = '<svg width=20 height=20 viewBox="0 0 24 24" fill=none stroke=' + m.icon_color + ' stroke-width=1.8>' + (m.icon_svg || '<circle cx=12 cy=12 r=10/>') + '</svg>';

    return '<div class="' + cls + '" data-url="' + (hasLink ? m.link_url : '') + '" onclick="openModule(this, \'' + (isInternal ? '_self' : '_blank') + '\')">' +
      '<div class=card-head>' +
        '<div class=icon-box style="background:' + m.icon_bg + '">' + iconHTML + '</div>' +
        '<span class="' + tagClass + '">' + tagText + '</span>' +
      '</div>' +
      '<h3>' + escapeHtml(m.name) + '</h3>' +
      '<div class=desc>' + escapeHtml(m.description || '') + '</div>' +
      '<div class=card-foot>' +
        (hasLink
          ? '<span class=link-text><svg width=12 height=12 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> 打开</span>'
          : '<span style=color:#bbb>链接待配置</span>')
      + '</div></div>';
  }).join('');
}

function openModule(el, target) {
  const url = el.dataset.url;
  if (url) {
    window.open(url, target || '_blank');
  }
}

async function loadReminder() {
  try {
    const res = await fetch('/api/key-account/reminder', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) return;
    const r = await res.json();
    const bar = document.getElementById('reminderBar');
    const text = document.getElementById('reminderText');

    if (r.unfilled_count === 0) {
      bar.className = 'reminder-bar done';
      text.innerHTML = `<strong>🎉 全部完成！</strong> 所有 ${r.total_count} 条重点客户本周已填报。`;
    } else {
      bar.className = 'reminder-bar';
      const dayLabel = r.days_remaining === 0 ? '今天截止' :
        r.days_remaining === 1 ? '还剩 1 天' : `还剩 ${r.days_remaining} 天`;
      text.innerHTML = `重点客户跟进：尚有 <strong>${r.unfilled_count} 条</strong> 未填报（共 ${r.total_count} 条），
        <span class="deadline">截止 ${r.deadline_date}，${dayLabel}</span>`;
    }
    bar.style.display = 'flex';
  } catch {}
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '/';
}

init();
</script>

<!-- 修改密码弹窗 -->
<div class="pwd-modal-overlay" id="pwdModal">
  <div class="pwd-modal">
    <h3>修改密码</h3>
    <div class="form-group">
      <label>旧密码</label>
      <input type="password" id="oldPwd" placeholder="请输入当前密码">
    </div>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="newPwd" placeholder="至少4位">
    </div>
    <div class="form-group">
      <label>确认新密码</label>
      <input type="password" id="confirmPwd" placeholder="再次输入新密码">
    </div>
    <div class="err-msg" id="pwdError"></div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closePwdModal()">取消</button>
      <button class="btn-confirm" onclick="submitChangePwd()">确认修改</button>
    </div>
  </div>
</div>

<script>
function showChangePwd() {
  document.getElementById('pwdModal').classList.add('show');
  document.getElementById('oldPwd').value = '';
  document.getElementById('newPwd').value = '';
  document.getElementById('confirmPwd').value = '';
  document.getElementById('pwdError').style.display = 'none';
  document.getElementById('oldPwd').focus();
}

function closePwdModal() {
  document.getElementById('pwdModal').classList.remove('show');
}

document.getElementById('pwdModal').addEventListener('click', function(e) {
  if (e.target === this) closePwdModal();
});

async function submitChangePwd() {
  var oldPwd = document.getElementById('oldPwd').value;
  var newPwd = document.getElementById('newPwd').value;
  var confirmPwd = document.getElementById('confirmPwd').value;
  var errEl = document.getElementById('pwdError');

  if (!oldPwd) { errEl.textContent = '请输入旧密码'; errEl.style.display = 'block'; return; }
  if (!newPwd) { errEl.textContent = '请输入新密码'; errEl.style.display = 'block'; return; }
  if (newPwd.length < 4) { errEl.textContent = '新密码至少4位'; errEl.style.display = 'block'; return; }
  if (newPwd !== confirmPwd) { errEl.textContent = '两次输入的新密码不一致'; errEl.style.display = 'block'; return; }

  try {
    var res = await fetch('/api/user/change-password', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
    });
    var data = await res.json();
    if (res.ok) {
      errEl.style.color = '#166534';
      errEl.textContent = '密码修改成功！';
      errEl.style.display = 'block';
      setTimeout(closePwdModal, 1200);
    } else {
      errEl.style.color = '#E24B4A';
      errEl.textContent = data.error || '修改失败';
      errEl.style.display = 'block';
    }
  } catch(e) {
    errEl.style.color = '#E24B4A';
    errEl.textContent = '网络错误，请重试';
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
