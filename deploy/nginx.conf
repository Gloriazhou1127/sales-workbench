# 销售工作台 Nginx 配置
# 替换 YOUR_DOMAIN 为实际域名
# 文件放到 /etc/nginx/sites-available/sales-workbench

server {
    listen 80;
    server_name YOUR_DOMAIN;
    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL 证书（Let's Encrypt 自动颁发）
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # 上传限制（数据导入用）
    client_max_body_size 50m;

    # 日志
    access_log /var/log/nginx/sales-workbench-access.log;
    error_log  /var/log/nginx/sales-workbench-error.log;

    # 反向代理到 Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（预留）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 静态文件直接服务（性能更好）
    location /static/ {
        alias /opt/sales-workbench/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
